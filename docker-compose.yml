version: '3.8'

services:
  # ============================================================================
  # 1. MOTOR DE VMS & EDGE AI (FastAPI + OpenVINO iGPU + Multiprocessing)
  # ============================================================================
  vms_engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casvms_engine
    restart: unless-stopped
    ports:
      - "8001:8000"   # REST API, WebSockets / SSE y Streaming MJPEG
      - "5020:5020"   # Modbus TCP Server
    environment:
      - PYTHONUNBUFFERED=1
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-casvms_super_secret_token_123456789_abcdef}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-casvms}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-telemetry}
      - MQTT_BROKER=${MQTT_BROKER:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MODBUS_HOST=${MODBUS_HOST:-0.0.0.0}
      - MODBUS_PORT=${MODBUS_PORT:-5020}
      - OPENVINO_DEVICE=${OPENVINO_DEVICE:-CPU}
      - OPENVINO_CACHE_DIR=/app/cache/openvino_cache
      - LIBVA_DRIVER_NAME=iHD
    # Mapeo para Linux con Intel iGPU nativa (habilitar si /dev/dri está presente en Linux)
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
    volumes:
      - ./storage:/app/storage
      - ./cache/openvino_cache:/app/cache/openvino_cache
      - ./config:/app/config
      - ./backend:/app
    depends_on:
      influxdb:
        condition: service_healthy
      eclipse-mosquitto:
        condition: service_started
    networks:
      - casvms_network

  # ============================================================================
  # 2. INFLUXDB 2.7 (Base de Datos de Series Temporales / Telemetría)
  # ============================================================================
  influxdb:
    image: influxdb:2.7
    container_name: casvms_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-casvms_admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:-casvms_password_secure123}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-casvms}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-telemetry}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-casvms_super_secret_token_123456789_abcdef}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - casvms_network

  # ============================================================================
  # 3. GRAFANA (Paneles de Control y Visualización Industrial)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: casvms_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - casvms_network

  # ============================================================================
  # 4. ECLIPSE MOSQUITTO 2 (Broker MQTT para Alarmas y Eventos IoT/SCADA)
  # ============================================================================
  eclipse-mosquitto:
    image: eclipse-mosquitto:2
    container_name: casvms_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - casvms_network

  # ============================================================================
  # 5. FRONTEND WEB UI (Servidor NGINX para la Shell de Escritorio CASVMS)
  # ============================================================================
  frontend_ui:
    image: nginx:alpine
    container_name: casvms_frontend
    restart: unless-stopped
    ports:
      - "1420:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - casvms_network

# ==============================================================================
# VOLÚMENES PERSISTENTES Y RED
# ==============================================================================
volumes:
  influxdb_data:
    name: casvms_influxdb_data
  influxdb_config:
    name: casvms_influxdb_config
  grafana_data:
    name: casvms_grafana_data
  mosquitto_data:
    name: casvms_mosquitto_data
  mosquitto_log:
    name: casvms_mosquitto_log

networks:
  casvms_network:
    name: casvms_network
    driver: bridge
