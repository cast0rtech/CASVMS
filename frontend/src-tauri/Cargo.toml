[package]
name = "casvms-desktop"
version = "1.0.0"
description = "Industrial Edge AI Video Management System Desktop Shell"
authors = ["CASVMS Engineering"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["fs-all", "dialog-all", "notification-all", "http-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
