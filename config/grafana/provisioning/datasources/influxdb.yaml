apiVersion: 1

datasources:
  - name: InfluxDB_CASVMS
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: casvms
      defaultBucket: telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: casvms_super_secret_token_123456789_abcdef
    isDefault: true
    editable: true
